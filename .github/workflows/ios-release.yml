name: iOS Release (TestFlight)

# 手動実行: Actions → iOS Release → Run workflow → version と notes を入力
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン (例: 1.7.0)'
        required: true
      notes:
        description: 'リリースノート'
        required: true

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bump version
        run: |
          CURRENT_CODE=$(grep -oP '(?<=\+)\d+' pubspec.yaml | head -1)
          NEW_CODE=$((CURRENT_CODE + 1))
          sed -i '' -E "s/^version:.*/version: ${{ inputs.version }}+$NEW_CODE/" pubspec.yaml
          echo "VERSION=${{ inputs.version }}+$NEW_CODE" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install

      - name: Import Apple certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH

          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

          rm $RUNNER_TEMP/cert.p12

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --obfuscate --split-debug-info=build/debug-info

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > \
            ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Commit version bump
        run: |
          git config user.email "kayaharuka@hotmail.com"
          git config user.name "kayah"
          git add pubspec.yaml
          git commit -m "release(ios): v${{ inputs.version }}"
          git push

      - name: Update server version manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "TestFlight upload complete: v${{ inputs.version }} (${{ env.VERSION }})"
          echo "App Store Connect will process the build in 15-30 minutes."
