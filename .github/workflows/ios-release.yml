name: iOS Release (TestFlight)

# 手動実行: Actions → iOS Release → Run workflow → version と notes を入力
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン (例: 1.7.0)'
        required: true
      notes:
        description: 'リリースノート'
        required: true

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bump version
        run: |
          CURRENT_CODE=$(sed -n -E 's/^version:.*\+([0-9]+).*/\1/p' pubspec.yaml)
          NEW_CODE=$((CURRENT_CODE + 1))
          sed -i '' -E "s/^version:.*/version: ${{ inputs.version }}+$NEW_CODE/" pubspec.yaml
          echo "VERSION=${{ inputs.version }}+$NEW_CODE" >> $GITHUB_ENV
          echo "Bumped to ${{ inputs.version }}+$NEW_CODE (from +$CURRENT_CODE)"

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install

      - name: Setup App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > \
            ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "AUTH_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" >> $GITHUB_ENV

      - name: Build Flutter for iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --obfuscate --split-debug-info=build/debug-info

      - name: Archive with xcodebuild
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=7482F26LUS

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Commit version bump
        run: |
          git config user.email "kayaharuka@hotmail.com"
          git config user.name "kayah"
          git add pubspec.yaml
          git commit -m "release(ios): v${{ inputs.version }}"
          git push

      - name: Update server version manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "TestFlight upload complete: v${{ inputs.version }} (${{ env.VERSION }})"
          echo "App Store Connect will process the build in 15-30 minutes."
